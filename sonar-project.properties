sonar.projectKey=adamkwhite_multisport-lineup-app
sonar.organization=adamkwhite
sonar.host.url=https://sonarcloud.io
sonar.python.version=3.12
# Token updated 2025-11-19
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=lcov.info
sonar.sources=app.py,static,sports,templates
sonar.tests=tests
sonar.exclusions=**/*test*/**,**/__pycache__/**,lineup-venv/**,baseball-venv/**,venv/**,htmlcov/**,test-results/**,coverage/**,scripts/**,docs/**,ai-dev-tasks/**,node_modules/**,*.pem,*.png,*.jpg,*.jpeg,*.gif
sonar.test.inclusions=tests/**/*.test.js,tests/**/*.py
# Templates are excluded from COVERAGE only, not from analysis - they stay in
# sonar.sources above, so smells and vulnerabilities in them are still reported.
#
# The Jinja templates carry ~60KB of inline JavaScript each. Coverage comes from
# jest (lcov.info), which only instruments static/js/, so template lines are
# scored 0% by construction and nothing in the current setup can raise that.
# Left in, the 80% new-code coverage condition fails any predominantly-template
# change on the strength of a number that measures nothing - it blocked a pure
# no-behaviour-change refactor at 33.3%.
#
# The real fix is extracting that inline JS into testable modules under
# static/js/, at which point this exclusion should be removed and the coverage
# requirement will start meaning something for the UI.
sonar.coverage.exclusions=tests/**,**/*test*/**,scripts/**,docs/**,ai-dev-tasks/**,templates/**
sonar.cpd.exclusions=templates/**/*.html

# Quality gate enforcement
sonar.qualitygate.wait=true
